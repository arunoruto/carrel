name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Offline tests only; the ones needing internet are #[ignore]d.
      - run: cargo test --locked --no-fail-fast

  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # To drop the superseded store caches.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The store, with the dependencies built (crane's cargoArtifacts), kept until they change.
      - uses: nix-community/cache-nix-action@v7
        with:
          # Whatever decides the dependencies' build: the locks, and how the Nix files build them.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'Cargo.lock', 'web/package-lock.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never
      # Builds the package and runs its tests in the Nix sandbox; the second keeps the dependencies from the
      # garbage collection before the cache is saved.
      - run: nix build --print-build-logs .#default .#default.cargoArtifacts
      - run: nix develop --command cargo --version
      # The NixOS module in a VM: the service starts, answers and keeps strangers out.
      - if: matrix.os == 'ubuntu-latest'
        run: nix build --print-build-logs .#checks.x86_64-linux.module
