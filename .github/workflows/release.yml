name: Release

# Conventional commits on main drive semantic versioning: release-please keeps a release PR with the
# next version (fix: patch, feat: minor, feat!: major; minor while < 1.0) and the changelog. Merging it
# tags the release, and the binaries below are attached to it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}

  binaries:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The web UI, which build.rs embeds into the binary.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo build --release --locked --target "$TARGET"
      - run: target/"$TARGET"/release/carrel --version
      - name: Package
        run: |
          name="carrel-$TAG-$TARGET"
          mkdir "$name"
          cp target/"$TARGET"/release/carrel README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - run: gh release upload "$TAG" carrel-*.tar.gz carrel-*.tar.gz.sha256
        env:
          GH_TOKEN: ${{ github.token }}

  # The formula in github.com/arunoruto/homebrew-tap (`brew install arunoruto/tap/carrel`), then
  # installed from there as a check. Pushes with the secret HOMEBREW_TAP_KEY, the private half of a
  # deploy key with write access to that repository; without it the tap is left alone.
  homebrew:
    needs: [release-please, binaries]
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
    steps:
      - uses: actions/checkout@v7
      - if: env.TAP_KEY == ''
        run: echo "::warning::no HOMEBREW_TAP_KEY secret, so the Homebrew tap wasn't updated"
      - if: env.TAP_KEY != ''
        run: |
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          git clone git@github.com:arunoruto/homebrew-tap.git tap
          mkdir -p tap/Formula
          sh packaging/homebrew.sh "$TAG" > tap/Formula/carrel.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/carrel.rb
          git commit -m "carrel ${TAG#v}"
          git push
          rm "$key"
      - if: env.TAP_KEY != ''
        run: |
          brew install arunoruto/tap/carrel
          brew test carrel
