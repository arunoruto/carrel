name: Container

# Builds the carrel image and publishes it to ghcr.io/<owner>/carrel: `edge` for every push to main, and
# `1.2.3`, `1.2` and `latest` for releases. Releases come from release.yml, which calls this workflow:
# release-please's tags are pushed with GITHUB_TOKEN, and those don't trigger workflows themselves.
on:
  push:
    branches: [main]
  pull_request:
  # With a tag, (re)builds that release's image.
  workflow_dispatch:
    inputs:
      tag:
        description: A release's tag, e.g. v0.7.0; empty for edge
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        description: The release's tag, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Each platform on a runner of its own kind: arm64 under emulation took the best part of an hour.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      # Pushed by digest alone; `merge` puts the platforms together under the tags.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Per platform, so neither evicts the other's layers (the dependencies above all).
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: github.event_name != 'pull_request'
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          retention-days: 1

  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main,enable=${{ inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
      - working-directory: digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
