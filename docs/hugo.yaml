baseURL: https://arunoruto.github.io/carrel/
title: carrel
locale: en
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Commands
      pageRef: /docs/reference/commands
      weight: 2
    - name: Releases
      url: https://github.com/arunoruto/carrel/releases
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: https://github.com/arunoruto/carrel
      params:
        icon: github

params:
  description: A research paper library for you and your AI
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 28
      height: 28
  page:
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: true
  editURL:
    enable: true
    base: https://github.com/arunoruto/carrel/edit/main/docs/content
  displayUpdatedDate: true
  dateFormat: January 2, 2006
  search:
    enable: true
    type: flexsearch
  highlight:
    copy:
      enable: true
      display: hover
