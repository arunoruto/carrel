[package]
name = "carrel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A research paper library for you and your AI: PDFs and BibTeX, full text and figures, projects, a TUI and an MCP server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arunoruto/carrel"
homepage = "https://arunoruto.github.io/carrel"
readme = "README.md"
keywords = ["bibtex", "research", "papers", "mcp", "tui"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
deunicode = "1.6.2"
dirs = "7.0.0"
libc = "0.2.191"
minijinja = "3.0.1"
ratatui = { version = "0.30.2", features = ["serde"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt"] }
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
strip = true
lto = "thin"
